<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog do Desenvolvedor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #f9f9f9;
        }
        header {
            background: #2c3e50;
            color: #fff;
            padding: 1rem 2rem;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-right: 1rem;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        article {
            padding: 2rem;
        }
        figure {
            margin: 1.5rem 0;
            text-align: center;
        }
        figure img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        figcaption {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0.5rem;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            background: #2c3e50;
            color: #fff;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#">Blog do Desenvolvedor</a> |
            <a href="#">Artigo</a> |
            <a href="#">Sobre</a>
        </nav>
    </header>

    <main>
        <article>
            <h1>A Importância da Semântica Web</h1>
            <p>A semântica garante que leitores de tela e robôs de busca compreendam a função real de cada bloco da interface.</p>
            
            <figure>
                <img src="https://images.pexels.com/photos/7988114/pexels-photo-7988114.jpeg?cs=srgb&dl=pexels-mikhail-nilov-7988114.jpg&fm=jpg" alt="Desenvolvimento de software baseado em boas práticas.">
                <figcaption>Desenvolvimento de software baseado em boas práticas.</figcaption>
            </figure>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 Blog do Desenvolvedor &bull; Todos os direitos reservados.</p>
    </footer>

</body>
</html>
